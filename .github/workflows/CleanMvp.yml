name: Clean MVP APK
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: clean-mvp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NATIVE_TARGET: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable MVP and check recommendation filtering
        run: |
          chmod +x gradlew
          ./gradlew :core-data:testDebugUnitTest :app:assembleDev --max-workers=4 --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPai-Clean-MVP-arm64
          path: app/build/outputs/bilipai/dev/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-test-reports
          path: core-data/build/reports/tests/
          if-no-files-found: ignore
