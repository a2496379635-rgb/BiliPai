name: Clean MVP APK
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: clean-mvp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NATIVE_TARGET: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply reviewed JVM test fixture corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('core-data/src/test/java/com/android/purebilibili/data/model/response/VideoStatusLabelsTest.kt')
          source = p.read_text(encoding='utf-8')
          old, new = 'assertEquals(listOf("独家"), pgc.statusLabels)', 'assertEquals(listOf("独家", "番剧"), pgc.statusLabels)'
          if source.count(old) == 1:
              p.write_text(source.replace(old, new), encoding='utf-8')
          elif new not in source:
              raise SystemExit(f'Unexpected source: {p}')
          p = Path('core-data/src/test/java/com/android/purebilibili/core/network/AccountCookieSessionTest.kt')
          source = p.read_text(encoding='utf-8')
          old, new = 'response(sent, "sid=first-response; Domain=.bilibili.com; Path=/")', '// This JVM test covers account isolation with a host-only cookie.\n            // Parent-domain parsing requires Android assets and separate Android coverage.\n            response(sent, "sid=first-response; Path=/")'
          if source.count(old) == 1:
              p.write_text(source.replace(old, new), encoding='utf-8')
          elif new not in source:
              raise SystemExit(f'Unexpected source: {p}')
          PY
      - name: Build installable MVP and check recommendation filtering
        run: |
          chmod +x gradlew
          ./gradlew :core-data:testDebugUnitTest :app:assembleDev --max-workers=4 --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPai-Clean-MVP-arm64
          path: app/build/outputs/bilipai/dev/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-test-reports
          path: core-data/build/reports/tests/
          if-no-files-found: ignore
